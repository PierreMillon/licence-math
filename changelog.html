<style>
  .changelog{ max-width:640px; width:100%; margin:0 auto; }
  .changelog__entry{
    border:1px solid var(--fg-dim);
    background:var(--bg-panel);
    padding:12px 16px;
    margin-bottom:10px;
  }
  .changelog__head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .changelog__v{
    font-family:var(--font-title);
    font-size:1.15rem;
    color:var(--amber);
    flex:none;
  }
  .changelog__date{
    font-family:var(--font-subtitle);
    font-size:.78rem;
    color:var(--fg-dim);
    flex:none;
    margin-left:auto;
  }
  .changelog__desc{ font-size:1.05rem; line-height:1.4; overflow-wrap:anywhere; }
  .changelog__desc ul{ margin:4px 0 0; padding-left:1.1em; }
  .changelog__desc li{ margin-top:2px; }
  .changelog__note{
    font-family:var(--font-subtitle);
    font-size:.75rem;
    color:var(--fg-dim);
    line-height:1.6;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line, #2a2a2a);
  }
  .changelog{ margin-top:38px; }
</style>
