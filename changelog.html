<style>
  .changelog{ max-width:640px; margin:0 auto; }
  .changelog__entry{
    border:1px solid var(--fg-dim);
    background:var(--bg-panel);
    padding:12px 16px;
    margin-bottom:10px;
  }
  .changelog__entry.current{ border-color:var(--fg); }
  .changelog__head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .changelog__v{
    font-family:var(--font-title);
    font-size:1.15rem;
    color:var(--amber);
    flex:none;
  }
  .changelog__tag{
    font-family:var(--font-subtitle);
    font-size:.75rem;
    color:var(--fg-dim);
    border:1px solid var(--fg-dim);
    padding:1px 6px;
  }
  .changelog__desc{ font-size:1.05rem; line-height:1.4; }
  .changelog__gap{
    font-family:var(--font-subtitle);
    color:var(--fg-dim);
    font-size:.8rem;
    text-align:center;
    margin:6px 0 16px;
  }
</style>
