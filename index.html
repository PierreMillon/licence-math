<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SYNTHÈSE // L1 MATHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Micro+5&family=Silkscreen&family=Jersey+10&display=optional" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=126">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="L1 Maths">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
</head>
<body>
<a href="index.html" class="menu-btn" aria-label="Menu"><svg class="heart-icon" viewBox="0 0 7 6" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/></svg></a>
<div class="crt">

  <header class="site-header">
    <h1 class="logo">L1 MATHS</h1>
    <div class="grade-block-wrap">
      <div class="grade-block">
        <div class="progress-bar global-progress-bar" id="globalProgressBar" aria-label="Progression globale du site (appuyer pour la note théorique)"></div>
        <div class="global-progress-score" id="globalProgressScore">0/0</div>
      </div>
      <div class="grade-tooltip" id="gradeTooltip"></div>
    </div>
  </header>

  <main>
    <section class="chapter-grid" id="chapterGrid" aria-label="Liste des chapitres">
      <!-- injecté par app.js -->
    </section>
  </main>

  <div class="victory-scene" id="victoryScene" hidden>
    <div class="victory-title">VICTOIRE !</div>
    <div class="victory-stage">
      <div class="victory-dragon" id="victoryDragon"></div>
      <div class="victory-knight" id="victoryKnight"></div>
      <div class="victory-sword" id="victorySword"></div>
    </div>
    <div class="victory-caption">Le chevalier a terrassé le dragon cette semaine : 80% des exercices ont été refaits avant le reset.</div>
    <button type="button" class="victory-dismiss" id="victoryDismiss">CONTINUER</button>
  </div>

  <div class="defeat-scene" id="defeatScene" hidden>
    <div class="defeat-title">DÉFAITE</div>
    <div class="defeat-stage">
      <div class="defeat-dragon" id="defeatDragon"></div>
      <div class="defeat-knight" id="defeatKnight"></div>
    </div>
    <div class="defeat-caption">Le dragon l'a emporté cette semaine : moins de 80% des exercices ont été refaits avant le reset.</div>
    <button type="button" class="defeat-dismiss" id="defeatDismiss">CONTINUER</button>
  </div>

  <div class="battle-scene" id="battleScene">
    <div class="scene-moon" id="sceneMoon" aria-hidden="true"></div>
    <div class="scene-castle" id="sceneCastle" aria-hidden="true"></div>
    <div class="scene-cave" id="sceneCave" aria-hidden="true"></div>
    <div class="scene-dragon" id="sceneDragon" aria-hidden="true" data-tooltip="Le dragon de la semaine sort de sa grotte et s'approche chaque jour — le combat a lieu samedi à minuit."></div>
    <div class="scene-plan2" id="scenePlan2" aria-hidden="true"></div>
    <div class="battle-zone">
      <div class="creature-zone" id="creatureZone">
        <div class="creature-bubble" id="creatureBubble"></div>
        <div class="creature-figure" id="creatureFigure"></div>
        <div class="skull-pile" id="skullPile" aria-label="Réinitialisations effectuées"></div>
        <div class="creature-losses" id="creatureLosses" aria-label="Défaites du combat hebdomadaire"></div>
      </div>
      <div class="knight-zone" id="knightZone">
        <div class="knight-girl" id="knightGirl" aria-hidden="true"></div>
        <div class="knight-figure" id="knightFigure" aria-hidden="true"></div>
        <div class="knight-coins" id="knightCoins" aria-label="Victoires du combat hebdomadaire"></div>
      </div>
    </div>
    <div class="weekly-score" id="weeklyScore"></div>
  </div>


  <footer class="site-footer">
    <div class="pixel-rule">════════════════════════════════════════════════</div>
    <div id="footerHint">CHOISIR CHAPITRE <span class="cursor">_</span></div>
  </footer>

</div>
<script src="menu.js?v=126"></script>
<script src="pwa.js?v=126"></script>
<script src="tooltips.js?v=126"></script>
<script src="weekly.js?v=126"></script>

<script src="creature-svgs.js?v=126"></script>
<script src="creature.js?v=126"></script>
<script src="knight-svgs.js?v=126"></script>
<script src="knight.js?v=126"></script>
<script src="victory.js?v=126"></script>
<script src="scene.js?v=126"></script>
<script src="app.js?v=126"></script>
<script data-goatcounter="https://mathprogramme.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
